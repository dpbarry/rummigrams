<div class="home-container">
    <div class="app-toolbar">
        <button aria-label="Game info" class="icon-btn" id="home-btn-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
        </button>
        <button aria-label="Toggle theme" class="icon-btn" id="home-btn-theme">
            <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                stroke-width="1.5" viewBox="0 0 24 24" width="18">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" x2="12" y1="1" y2="3"></line>
                <line x1="12" x2="12" y1="21" y2="23"></line>
                <line x1="4.22" x2="5.64" y1="4.22" y2="5.64"></line>
                <line x1="18.36" x2="19.78" y1="18.36" y2="19.78"></line>
                <line x1="1" x2="3" y1="12" y2="12"></line>
                <line x1="21" x2="23" y1="12" y2="12"></line>
                <line x1="4.22" x2="5.64" y1="19.78" y2="18.36"></line>
                <line x1="18.36" x2="19.78" y1="5.64" y2="4.22"></line>
            </svg>
        </button>
    </div>

    <div class="home-layout">
        <div class="parallax-scene" id="parallax-scene"></div>

        <div class="logo-container">
            <h1 class="logo">Rummigrams</h1>
        </div>

        <div class="start-assembly">
            <button class="hero-play-btn" id="home-btn-start">
                <span class="hero-text">Play</span>

            </button>

            <button class="continue-btn" id="home-btn-continue" style="display: none;">
                Continue Previous Game
            </button>

            <div class="settings-attachment" id="home-settings-panel">
                <div class="compact-setting">
                    <label>Difficulty</label>
                    <div class="pill-selector">
                        <label class="slider-control compact">
                            <input max="5" min="1" step="0.1" type="range" value="3">
                            <div class="slider-track"></div>
                            <div class="slider-thumb"></div>
                        </label>
                        <span class="setting-value-display">Casual</span>
                    </div>
                </div>

                <div class="compact-setting">
                    <label>Grid Size</label>
                    <div class="pill-selector">
                        <label class="slider-control compact">
                            <input max="8" min="4" step="0.1" type="range" value="6">
                            <div class="slider-track"></div>
                            <div class="slider-thumb"></div>
                        </label>
                        <span class="setting-value-display">6×6</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="secondary-action-btn" id="home-btn-create">
            Create Room
        </button>
    </div>

    <div class="info-dialog-overlay" id="info-dialog-overlay">
        <div class="info-dialog" id="info-dialog">
            <button class="info-dialog-close" id="info-dialog-close" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="info-dialog-title">How to Play</h2>
            <div class="info-dialog-content">
                <div class="info-rule">
                    <p>Make straights (sequential) or flushes (matching)</p>
                    <div class="info-tile-row">
                        <div class="info-tile">3</div>
                        <div class="info-tile">4</div>
                        <div class="info-tile">5</div>
                        <span class="info-or">or</span>
                        <div class="info-tile">7</div>
                        <div class="info-tile">7</div>
                        <div class="info-tile">7</div>
                    </div>
                </div>
                <div class="info-rule">
                    <p>Groups need at least 3 tiles</p>
                    <div class="info-tile-row">
                        <div class="info-tile info-tile--dim">2</div>
                        <div class="info-tile info-tile--dim">3</div>
                        <span class="info-label info-label--bad">✗</span>
                        <span class="info-spacer"></span>
                        <div class="info-tile info-tile--valid">4</div>
                        <div class="info-tile info-tile--valid">5</div>
                        <div class="info-tile info-tile--valid">6</div>
                        <span class="info-label info-label--good">✓</span>
                    </div>
                </div>
                <div class="info-rule">
                    <p>No blocks allowed, only lattice patterns</p>
                    <div class="info-tile-row">
                        <div class="info-tile-grid info-tile-grid--bad">
                            <div class="info-tile info-tile--error">3</div>
                            <div class="info-tile info-tile--error">3</div>
                            <div class="info-tile info-tile--error">4</div>
                            <div class="info-tile info-tile--error">4</div>
                        </div>
                        <span class="info-label info-label--bad">✗</span>
                    </div>
                </div>
                <div class="info-rule">
                    <p>Place all tiles in valid, connected groups to win</p>
                </div>
            </div>
        </div>
    </div>
    <script type="module">
        import { initHome } from './js/home.js';

        initHome();
        window.__pageReady = true;
    </script>
</div>
